services:
  postgres:
    image: postgres:16-alpine
    container_name: mandisaathi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-mandisaathi}
      POSTGRES_USER: ${DB_USER:-mandisaathi}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mandisaathi_secret}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mandisaathi} -d ${DB_NAME:-mandisaathi}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mandisaathi-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mandisaathi-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-mandisaathi}
      DB_USER: ${DB_USER:-mandisaathi}
      DB_PASSWORD: ${DB_PASSWORD:-mandisaathi_secret}
      SERVER_PORT: 8080
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
      GNANI_ENABLED: ${GNANI_ENABLED:-false}
      GNANI_API_KEY: ${GNANI_API_KEY:-}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - mandisaathi-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mandisaathi-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    networks:
      - mandisaathi-network

volumes:
  postgres_data:
    name: mandisaathi_postgres_data

networks:
  mandisaathi-network:
    name: mandisaathi_network
    driver: bridge

