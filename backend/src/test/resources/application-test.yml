server:
  port: 0

spring:
  application:
    name: mandisaathi-backend-test

  datasource:
    url: jdbc:h2:mem:mandisaathi_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    open-in-view: false

  flyway:
    enabled: false

gnani:
  enabled: false

