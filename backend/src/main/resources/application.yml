server:
  port: ${PORT:${SERVER_PORT:8080}}
  shutdown: graceful

spring:
  application:
    name: mandisaathi-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}

  datasource:
    url: ${SPRING_DATASOURCE_URL:${JDBC_DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mandisaathi}}}
    username: ${DB_USER:mandisaathi}
    password: ${DB_PASSWORD:mandisaathi_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

app:
  version: 0.1.0-phase1
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

gnani:
  enabled: ${GNANI_ENABLED:false}
  api-key: ${GNANI_API_KEY:}
  stt-url: ${GNANI_STT_URL:https://api.vachana.ai/stt/v3}
  tts-url: ${GNANI_TTS_URL:https://api.vachana.ai/api/v1/tts/inference}
  stt-model: ${GNANI_STT_MODEL:prisma-v2.5}
  tts-model: ${GNANI_TTS_MODEL:timbre-v2.5}
  timeout-ms: ${GNANI_TIMEOUT_MS:10000}
  tts-voice-hindi: ${GNANI_TTS_VOICE_HINDI:Nalini}
  tts-voice-punjabi: ${GNANI_TTS_VOICE_PUNJABI:Nalini}
  tts-voice-english: ${GNANI_TTS_VOICE_ENGLISH:Kaveri}

mandidata:
  enabled: ${MANDI_DATA_ENABLED:false}
  schedule-enabled: ${MANDI_DATA_SCHEDULE_ENABLED:false}
  cron: ${MANDI_DATA_CRON:0 0 19 * * *}
  zone: ${MANDI_DATA_ZONE:Asia/Kolkata}
  api-key: ${DATA_GOV_IN_API_KEY:}
  api-url: ${DATA_GOV_IN_URL:https://api.data.gov.in/resource/9ef84268-d588-465a-a308-a864a43d0070}
  limit: ${MANDI_DATA_LIMIT:100}
  timeout-ms: ${MANDI_DATA_TIMEOUT_MS:15000}

logging:
  level:
    root: INFO
    com.mandisaathi: DEBUG
    org.springframework.web: INFO
    org.flywaydb: INFO

