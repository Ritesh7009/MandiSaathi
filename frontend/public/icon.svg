<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E5C42"/>
      <stop offset="100%" stop-color="#113928"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D179"/>
      <stop offset="100%" stop-color="#C29B44"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded corners for adaptive/maskable icons -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Outer subtle circular ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#D7B66A" stroke-width="6" opacity="0.4"/>
  
  <!-- Central Wheat & Plant Emblem -->
  <g transform="translate(256, 256)">
    <!-- Central Stalk -->
    <path d="M 0,160 Q -5,40 0,-140" fill="none" stroke="url(#gold)" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Top Wheat Grain -->
    <path d="M 0,-140 C 14,-170 0,-200 0,-200 C 0,-200 -14,-170 0,-140 Z" fill="url(#gold)"/>
    
    <!-- Wheat Grains Right Side -->
    <path d="M 4,-110 C 35,-125 50,-95 4,-85 Z" fill="url(#gold)"/>
    <path d="M 4,-70 C 45,-85 60,-55 4,-45 Z" fill="url(#gold)"/>
    <path d="M 4,-30 C 50,-45 65,-15 4,-5 Z" fill="url(#gold)"/>
    <path d="M 4,10 C 50,-5 65,25 4,35 Z" fill="url(#gold)"/>
    
    <!-- Wheat Grains Left Side -->
    <path d="M -4,-110 C -35,-125 -50,-95 -4,-85 Z" fill="url(#gold)"/>
    <path d="M -4,-70 C -45,-85 -60,-55 -4,-45 Z" fill="url(#gold)"/>
    <path d="M -4,-30 C -50,-45 -65,-15 -4,-5 Z" fill="url(#gold)"/>
    <path d="M -4,10 C -50,-5 -65,25 -4,35 Z" fill="url(#gold)"/>

    <!-- Bottom Sprouting Leaves (Growth / Mandi Saathi) -->
    <path d="M -4,65 C -70,55 -95,115 -10,125 Z" fill="#4ADE80" opacity="0.9"/>
    <path d="M 4,65 C 70,55 95,115 10,125 Z" fill="#4ADE80" opacity="0.9"/>
    
    <!-- Sound Waves / AI Voice Indicator -->
    <path d="M 85,-40 A 100 100 0 0 1 85,40" fill="none" stroke="#F5F3EA" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
    <path d="M 115,-60 A 140 140 0 0 1 115,60" fill="none" stroke="#F5F3EA" stroke-width="8" stroke-linecap="round" opacity="0.5"/>
  </g>
</svg>
